query TournamentPage($tournamentId: ID!) {
  tournament(tournamentId: $tournamentId) {
    ...TournamentTabs

    id
    name
    mainImageUrl
    url
    streamingUrl
    description
    startsAt

    standings {
      id
      place

      player {
        id
        slug
        name
        avatarUrl
      }
    }

    videos {
      id
      label
      battlesCount
    }
  }
}
