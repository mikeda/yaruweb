query BattleList($tournamentId: ID, $playerSlug: String, $characterSlug: String, $after: String) {
  battles(
    tournamentId: $tournamentId,
    playerSlug: $playerSlug,
    characterSlug: $characterSlug,
    after: $after,
    first: 10
  ) {
    edges {
      node { ...BattleListItem }
      cursor
    }

    pageInfo { ...Pagination }
  }
}
