query PageDashboardMoveEdit($moveId: ID!) {
  move(moveId: $moveId) {
    ...move

    moveCategory {
      id
      name

      character {
        slug
        name

        states {
          id
          name
        }
      }
    }
  }
}

mutation UpdateAttackMove($moveId: ID!, $attributes: AttackMoveAttributes!) {
  updateAttackMove(input: { moveId: $moveId, attributes: $attributes }) {
    move {
      id
    }
  }
}
