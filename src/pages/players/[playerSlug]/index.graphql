query PlayerPage($playerSlug: String!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs

    id
    name
    slug
    avatarUrl
    twitterId
    streamingUrl
    description

    tournamentRankings {
      id
      place

      tournament {
        id
        name
        mainImageUrl
        startsAt
      }
    }

    tournamentBattles {
      id

      tournamentVideo {
        id

        tournament {
          id
          name
          startsAt
        }
      }

      sides {
        player {
          name
        }

        character {
          name
        }

        rounds
      }
    }
  }
}