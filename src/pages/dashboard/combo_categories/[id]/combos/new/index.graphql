fragment MoveSelectOption on MoveCategory {
  id
  name

  moves {
    id
    name
  }
}

query PageDashboardComboNew($comboCategoryId: ID!) {
  comboCategory(comboCategoryId: $comboCategoryId) {
    id
    name

    combos {
      ...ComboPositionSelect
    }


    character {
      slug
      name

      moveCategories {
        ...MoveSelectOption
      }
    }
  }
}
