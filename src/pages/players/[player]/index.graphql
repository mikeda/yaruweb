fragment PlayerPageProfile on Player {
  id
  name
  slug
  avatarUrl
  twitterId
  streamingUrl
  description
  winningsCount
  battlesCount
}

query PlayerPage($playerSlug: String!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs
    ...PlayerPageProfile
  }

  winnings(playerSlug: $playerSlug, per: 4) {
    records { ...PlayerWinningCard }
    paging { hasNext }
  }

  battles(playerSlug: $playerSlug, per: 4) {
    records { ...BattleListItem }
    paging { hasNext }
  }
}