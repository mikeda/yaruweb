fragment TournamentCard on Tournament {
  id
  name
  mainImageUrl
  startsAt
  videosCount

  standings {
    id
    place

    player {
      id
      name
    }
  }
}

query TournamentCards($after: String, $keyword: String) {
  tournaments(first: 12, after: $after, keyword: $keyword) {
    edges {
      node { ...TournamentCard }
      cursor
    }

    pageInfo { ...Pagination }
  }
}
