fragment ArticleCard on Article {
  id
  title
  description
  mainImageUrl
  publishedAt
  status

  author {
    id
    name
    avatarUrl
  }
}

query ArticleCards($after: String) {
  articles(first: 12, after: $after) {
    edges {
      node {
        ...ArticleCard
      }
      cursor
    }

    pageInfo {
      ...Pagination
    }
  }
}
