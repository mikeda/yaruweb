version: 2.1

orbs:
  node: circleci/node@5.0.0

executors:
  default:
    docker:
      - image: cimg/node:16.13.1

jobs:
  build:
    executor: default
    steps:
      - checkout
      - node/install:
        install-yarn: true
      - node/install-packages:
        pkg-manager: yarn

      - run:
          name: tsc
          command: yarn tsc --noEmit
          when: always

      - run:
          name: eslint
          command: yarn eslint
          when: always

      - run:
          name: stylelint
          command: yarn stylelint src/**/*.scss
          when: always

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
