query MyArticles($page: Int, $per: Int) {
  myArticles(page: $page, per: $per) {
    records {
      id
      title
      description
      mainImageUrl
      publishedAt
      faved
      favsCount
      status

      author {
        name
        avatarUrl
      }
    }

    paging {
      ...paging
    }
  }
}