query PageDashboardComboEdit($comboId: ID!) {
  combo(comboId: $comboId) {
    ...ComboForm

    comboCategory {
      id
      name

      combos {
        ...ComboPositionSelect
      }

      character {
        slug
        name

        moveCategories {
          ...MoveSelectOption
        }
      }
    }
  }
}
