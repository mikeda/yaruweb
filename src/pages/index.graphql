query TopPage {
  tournaments(thisWeek: true, per: 3) {
    records { ...TournamentCard }
  }

  battles(per: 3) {
    records { ...BattleListItem }
  }

  players(per: 4) {
    records { ...PlayerCard }
  }

  characters(order: use_rate, per: 4) {
    records { ...CharacterCard }
  }

  articles(per: 3) {
    records { ...ArticleCard }
  }
}