query PlayerPage($playerSlug: ID!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs

    id
    name
    slug
    avatarUrl
    twitterId
    streamingUrl
    description

    tournamentRankings {
      id
      place

      tournament {
        id
        name
        mainImageUrl
        startsAt
      }
    }
  }
}