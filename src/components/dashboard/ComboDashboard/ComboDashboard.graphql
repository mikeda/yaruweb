mutation CreateComboCategory($characterSlug: String!, $attributes: ComboCategoryAttributes!) {
  createComboCategory(input: { characterSlug: $characterSlug, attributes: $attributes }) {
    comboCategory {
      ...ComboDashboardCategory

      character {
        id
        comboCategories {
          id
          position
        }
      }
    }
  }
}

