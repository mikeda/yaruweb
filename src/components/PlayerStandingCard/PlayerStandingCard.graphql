fragment PlayerStandingCard on Standing {
  id
  place

  tournament {
    id
    name
    mainImageUrl
    startsAt
  }
}

query PlayerStandingCards($playerSlug: String!, $after: String) {
  player(playerSlug: $playerSlug) {
    id

    standings(first: 10, after: $after) {
      edges {
        node {
          ...PlayerStandingCard
        }
        cursor
      }

      pageInfo {
        ...Pagination
      }
    }
  }
}
