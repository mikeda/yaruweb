query PageTournament($tournamentId: ID!) {
  tournament(tournamentId: $tournamentId) {
    id
    name
    mainImageUrl
    url
    streamingUrl
    description
    organizerName
    organizerTwitterId
    startsAt

    videos {
      id
      youtubeVideoId
      title
      thumbnailUrl
      commentCount

      channel {
        name
      }
    }
  }
}