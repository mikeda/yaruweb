fragment ArticlePage on Article {
  id
  title
  description
  mainImageUrl
  publishedAt
  status
  category
  content

  author {
    name
    avatarUrl
  }

  relatedArticles {
    ...ArticleCard
  }
}

query ArticlePage($articleId: ID!) {
  article(articleId: $articleId) {
    ...ArticlePage
  }
}
