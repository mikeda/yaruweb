fragment TournamentVideoPageBattle on Battle {
  id
  round
  startSec

  sides {
    player { name }
    character { faceImageUrl }
    rounds
  }
}

query PageTournamentVideo($tournamentVideoId: ID!) {
  tournamentVideo(tournamentVideoId: $tournamentVideoId) {
    id
    youtubeVideoId
    title
    thumbnailUrl
    commentCount

    channel {
      name
    }

    tournament {
      id
      name
    }

    battles {
      ...TournamentVideoPageBattle
    }
  }
}
