fragment move on Move {
  id
  name
  kana
  startUpFrame
  powerCrush
  crouchingStatus
  jumpStatus
  homing
  screw
  wallBound
  note

  moveCategory {
    id
    name
  }

  moveVideo {
    ...moveVideo
  }

  commands {
    ...command
  }

  actions {
    ...action
  }

  conditions {
    ...condition
  }
}
