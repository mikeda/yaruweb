fragment TournamentVideoPageBattle on TournamentBattle {
  id
  round
  startSec

  sides {
    player { name }
  }
}

query PageTournamentVideo($tournamentVideoId: ID!) {
  tournamentVideo(tournamentVideoId: $tournamentVideoId) {
    ...tournamentVideo

    tournament {
      id
      name
    }

    battles {
      ...TournamentVideoPageBattle
    }
  }
}
