fragment TournamentPageBattle on Battle {
  id
  round
  startSec

  sides {
    player { name }
    character { faceImageUrl }
    rounds
  }
}

fragment TournamentPageVideo on TournamentVideo {
  id
  youtubeVideoId

  battles {
    ...TournamentPageBattle
  }
}

query TournamentPage($tournamentId: ID!) {
  tournament(tournamentId: $tournamentId) {
    id
    name
    mainImageUrl
    url
    streamingUrl
    description
    startsAt

    standings {
      id
      place

      player {
        id
        slug
        name
        avatarUrl
      }
    }

    videos {
      ...TournamentPageVideo
    }
  }
}