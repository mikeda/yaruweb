fragment MoveForm on Move {
  id
  name
  kana
  command
  statusAfter
  note
  position

  moveCategory {
    id
    name
  }

  moveable {
    __typename

    ... on AttackMove { ...attackMove }
    ... on ThrowMove { ...throwMove }
    ... on ReversalMove { ...reversalMove }
  }

  moveVideo {
    id
    m3u8Url
    thumbnailUrl
  }
}

fragment MovePositionSelect on Move {
  id
  name
  position
}
