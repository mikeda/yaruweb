version: 2.1

executors:
  default:
    docker:
      - image: cimg/node:16.13.1
        environment:
          TZ: Asia/Tokyo

commands:
  # 不要なキャッシュ保存やキャッシュ肥大化を防ぐためorbsを使わない
  yarn-install:
    steps:
      - restore_cache:
          key: yarn-deps-v2-{{ checksum "yarn.lock" }}

      - run:
          name: yarn
          command: yarn

      - save_cache:
          paths:
            - node_modules
          key: yarn-deps-v2-{{ checksum "yarn.lock" }}

jobs:
  lint:
    executor: default

    steps:
      - checkout
      - yarn-install

      - run:
          name: tsc
          command: yarn tsc --noEmit
          when: always

      - run:
          name: jest
          command: yarn jest
          when: always

      - run:
          name: eslint
          command: yarn eslint
          when: always

workflows:
  version: 2
  build_and_test:
    jobs:
      - lint
