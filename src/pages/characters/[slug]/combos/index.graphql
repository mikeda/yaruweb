fragment ComboListItem on Combo {
  id
  damage
  command
  note

  move { id }

  comboVideo {
    id
    m3u8Url
    thumbnailUrl
  }
}

query CharacterCombosPage($characterSlug: String!) {
  character(characterSlug: $characterSlug) {
    ...CharacterBreadcrumbs
    ...CharacterPageProfile

    comboCategories {
      id
      name

      combos {
        ...ComboListItem
      }
    }

    comboStarters {
      id
      name
      combosCount
    }
  }
}