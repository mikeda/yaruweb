query PageCharacter($characterSlug: String!) {
  character(characterSlug: $characterSlug) {
    ...CharacterBreadcrumbs
    ...CharacterCard

    story
    description

    tournamentBattles {
      id
      round

      tournamentVideo {
        id

        tournament {
          id
          name
          startsAt
        }
      }

      sides {
        player { name }
        character { faceImageUrl }
        rounds
      }
    }
  }
}