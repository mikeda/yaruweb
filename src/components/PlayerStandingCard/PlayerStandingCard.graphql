fragment PlayerStandingCard on Standing {
  id
  place

  tournament {
    id
    name
    mainImageUrl
    startsAt
  }
}

query PlayerStandingCards($playerSlug: String!, $after: String) {
  standings(playerSlug: $playerSlug, first: 10, after: $after) {
    edges {
      node { ...PlayerStandingCard }
      cursor
    }

    pageInfo { ...Pagination }
  }
}
