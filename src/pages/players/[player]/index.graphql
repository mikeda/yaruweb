fragment PlayerPageProfile on Player {
  id
  name
  slug
  avatarUrl
  twitterId
  streamingUrl
  standingsCount
  battlesCount
}

query PlayerPage($playerSlug: String!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs
    ...PlayerPageProfile

    description
  }

  battleCounts(playerSlug: $playerSlug, per: 10) {
    records { ...CharacterBattleCountChip }
  }
}