query PageDashboardHighlightEdit($tournamentVideoHighlightId: ID!) {
  tournamentVideoHighlight(tournamentVideoHighlightId: $tournamentVideoHighlightId) {
    id
    title
    startSec

    tournamentVideo {
      id
      title
      youtubeVideoId

      tournament {
        id
        name
      }
    }
  }
}
