fragment ArticlePageArticle on Article {
  id
  title
  description
  mainImageUrl
  publishedAt
  status
  category
  content

  author {
    name
    avatarUrl
  }

  relatedArticles {
    ...ArticleCard
  }
}

query ArticlePageArticle($articleId: ID!) {
  article(articleId: $articleId) {
    ...ArticlePageArticle
  }
}
