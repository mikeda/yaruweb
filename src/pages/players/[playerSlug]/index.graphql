fragment PlayerPageProfile on Player {
  id
  name
  slug
  avatarUrl
  twitterId
  streamingUrl
  description
  tournamentRankingsCount
  tournamentBattlesCount
}

query PlayerPage($playerSlug: String!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs
    ...PlayerPageProfile
  }

  tournamentRankings(playerSlug: $playerSlug, per: 5) {
    records {
      id
      place

      tournament {
        id
        name
        mainImageUrl
        startsAt
      }
    }

    paging {
      hasNext
    }
  }

  tournamentBattles(playerSlug: $playerSlug, per: 5) {
    records {
      id
      round

      tournamentVideo {
        id

        tournament {
          id
          name
          startsAt
        }
      }

      sides {
        player { name }
        character { faceImageUrl }
        rounds
      }
    }

    paging {
      hasNext
    }
  }
}