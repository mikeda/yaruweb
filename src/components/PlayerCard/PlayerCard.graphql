fragment PlayerCard on Player {
  id
  slug
  name
  avatarUrl
  standingsCount
  battlesCount
}

query PlayerCards($after: String, $keyword: String) {
  players(first: 20, after: $after, keyword: $keyword) {
    edges {
      node {
        ...PlayerCard
      }
      cursor
    }

    pageInfo {
      ...Pagination
    }
  }
}
