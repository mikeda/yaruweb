query PageCharacter($characterSlug: ID!) {
  character(characterSlug: $characterSlug) {
    slug
    name
    longName
    faceImageUrl
    country
    fightingStyle
    nameKana
    longNameKana
    mainImageUrl
    story
    description
    dlc

    moveCategories {
      id
      name
    }

    comboCategories {
      id
      name
    }
  }
}