query PlayerPage($playerSlug: String!) {
  player(playerSlug: $playerSlug) {
    ...PlayerBreadcrumbs

    id
    name
    slug
    avatarUrl
    twitterId
    streamingUrl
    description
  }

  tournamentRankings(playerSlug: $playerSlug, per: 5) {
    records {
      id
      place

      tournament {
        id
        name
        mainImageUrl
        startsAt
      }
    }

    paging {
      hasNext
    }
  }

  tournamentBattles(playerSlug: $playerSlug, per: 5) {
    records {
      id
      round

      tournamentVideo {
        id

        tournament {
          id
          name
          startsAt
        }
      }

      sides {
        player { name }
        character { faceImageUrl }
        rounds
      }
    }

    paging {
      hasNext
    }
  }
}