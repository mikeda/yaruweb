overwrite: true
schema: schema.graphql
documents:
  - './src/**/*.graphql'
generates:
  src/generated/graphql.ts:
    plugins:
      - 'typescript'
      - 'typescript-operations'
      - 'typescript-react-apollo'
    config:
      withHooks: true
      scalars:
        ISO8601DateTime: string
        ISO8601Date: string
