query PageDashboardMoveEdit($moveId: ID!) {
  move(moveId: $moveId) {
    ...move

    conditions {
      id
      name
    }

    moveCategory {
      id
      name

      character {
        slug
        name

        states {
          id
          name
        }

        conditions {
          id
          name
        }
      }
    }
  }
}
