query TopPage {
  tournaments(first: 3) {
    nodes {
      ...TournamentCard
    }
  }

  players(first: 4) {
    nodes {
      ...PlayerCard
    }
  }

  characters(first: 4, order: use_rate) {
    nodes {
      ...CharacterCard
    }
  }

  articles(first: 3) {
    nodes {
      ...ArticleCard
    }
  }
}
