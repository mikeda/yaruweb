fragment moveCategoryWithMoves on MoveCategory {
  ...moveCategory
  moves {
    ...move
  }
}

query CharacterMoves($characterSlug: ID!) {
  character(characterSlug: $characterSlug) {
    slug
    longName
    faceImageUrl
    country
    fightingStyle
    story
    description

    moveCategories {
      ...moveCategoryWithMoves
    }
  }
}
